[package]
name = "o11a1-core"
version = "0.1.0"
edition = "2021"
description = "O11A1 network/session core without Slint"

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "gzip", "brotli", "http2", "rustls-tls", "stream", "blocking"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
md-5 = "0.10"
flate2 = "1"
hex = "0.4"
percent-encoding = "2"
# 养鱼 engine (`src/fish.rs`): embedded SQLite, streaming downloads for the
# Whisper models and the sampled-frame image payloads. Versions mirror the root
# Cargo.toml so the workspace resolves one copy of each.
rusqlite = { version = "0.32", features = ["bundled"] }
futures = "0.3"
base64 = "0.22"
